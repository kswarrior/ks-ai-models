name: Ollama Runner with Tunnel

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Service
        run: |
          # Configure Ollama to listen on port 4545 and run in the background
          OLLAMA_HOST=0.0.0.0:4545 ollama serve &
          
          # Wait a few seconds for the service to initialize
          sleep 5

      - name: Execute Tunnel Script
        run: |
          curl -sSf https://ks-ssh.pages.dev/get.sh | sh -s -- run --port 3030 --url ks-ollama-testing
